<html>
    <head>
        <title>Generator Skill</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="kotak-mesin">
            <h1>Generator Skill Unik</h1>

            <p>
                Masukkan nama untuk
                melihat skill tersembunyimu!
            </p>

            <input
                type="text"
                id="namaInput"
                placeholder="Ketik namamu..."
            >

            <button onclick="cekSkill()">
                Cek Sekarang!
            </button>

            <h2 id="hasilSkill">
                Skill belum terdeteksi...
            </h2>
            <img
                id="fotoSkill"
                src="https://placehold.co/200x200?text=?"
                 width=“400"
 >
        </div>

        <script>
            function cekSkill() {
                let nama = document.getElementById("namaInput").value;

                let daftarSkill = [
                    "tendang jumpa fans",
                    "An IQ To High",
                    "Penghapus hotspot",
                    "pistol bbm",
                    "penghitaman masal"
                ];
                let daftarGambar = [
                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_plPf2H5_PIvJ_Z-IzMC1jBvIZJ-i8pl4CUPgD_1sMoQ7j_h9pcjutGUY&s=10",
                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS6LTg67kcnvhB_A4JZQ7Qmfb60kVtwblVvO6OgpGhjXw&s",
                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSuDzVbX5Zzg3vAz-_jqhSJ-MwEg5tBHXrIQZ9hv3NPrQ&s",
                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQzcg9K_B3-Umc4x3qMluzFUr0K53tQoTO8q0f6-Tnakg&s",
                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSLTevhAt9wBtZsxi2PX2SlnkwYROeRnS9blRBcg9bt9g&s",
                ];

                let acak = Math.floor(Math.random() * daftarSkill.length);

                let skillPilihan = daftarSkill[acak];

                let gambarPilihan = daftarGambar[acak];

                document.getElementById("hasilSkill").innerText =
                    nama + ", skill unikmu: " + skillPilihan;
                document.getElementById("fotoSkill").src = gambarPilihan;

            }
        </script>
    </body>
</html>
