<html>
    <head>
        <title>Generator Skill</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="kotak-mesin">
            <h1>Generator Skill Unik</h1>

            <p>
                Masukkan nama untuk
                melihat skill tersembunyimu!
            </p>

            <input
                type="text"
                id="namaInput"
                placeholder="Ketik namamu..."
            >

            <button onclick="cekSkill()">
                Cek Sekarang!
            </button>

            <h2 id="hasilSkill">
                Skill belum terdeteksi...
            </h2>
            <img
                id="fotoSkill"
                src="https://placehold.co/200x200?text=?"
                 width=“400"
 >
        </div>

        <script>
            function cekSkill() {
                let nama = document.getElementById("namaInput").value;

                let daftarSkill = [
                    "tendang jumpa fans",
                    "An IQ To High",
                    "Penghapus hotspot",
                    "pistol bbm",
                    "penghitaman masal"

                let daftarGambar = [

                    "https://www.google.com/imgres?q=bbm&imgurl=https%3A%2F%2Fmenpan.go.id%2Flegacy%2Fimages%2Fberita%2F2024%2F20241001_-_Pertamina_Resmi_Turunkan_Harga_BBM_Non-Subsidi_per_1_Oktober_2024_di_Seluruh_Indonesia.jpeg&imgrefurl=https%3A%2F%2Fmenpan.go.id%2Fposts%2Fpertamina-resmi-turunkan-harga-bbm-non-subsidi-per-1-oktober-2024-di-seluruh-indonesia&docid=v1hGCqNtGdRC6M&tbnid=jKmMv-bYIpTFWM&vet=12ahUKEwiIqcDoxIGYAxUA4TgGHTgnLqwQnPAOegUIgAEQAA..i&w=2560&h=1706&hcb=2&ved=2ahUKEwiIqcDoxIGYAxUA4TgGHTgnLqwQnPAOegUIgAEQAA",

                let acak = Math.floor(Math.random() * daftarSkill.length);

                let skillPilihan = daftarSkill[acak];

                let gambarPilihan = daftarGambar[acak];

                document.getElementById("hasilSkill").innerText =
                    nama + ", skill unikmu: " + skillPilihan;
                document.getElementById("fotoSkill").src = gambarPilihan;
